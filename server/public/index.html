<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Página B — Visão IA</title>
<link rel="stylesheet" href="pageB.css" />
<link rel="stylesheet" href="vendor/hljs-theme.css" />
<link rel="stylesheet" href="vendor/katex.min.css" />
</head>
<body>
  <header>
    <div class="status">
      <span id="statusDot" class="dot"></span>
      <span id="statusText">conectando…</span>
    </div>
    <div class="model-row">
      <select id="modelSelect"></select>
      <select id="qualitySelect" title="Resolução enviada à IA">
        <option value="1024">Rápido · 1024 px</option>
        <option value="1600" selected>Equilibrado · 1600 px</option>
        <option value="2560">Detalhado · 2560 px</option>
      </select>
      <button id="refreshModels" title="Atualizar modelos">⟳</button>
    </div>
  </header>

  <main>
    <div class="memory-bar">
      <span id="memoryCount">Memória ativa · 0 análises</span>
      <button id="clearMemory" disabled title="Apagar definitivamente o contexto lembrado pela IA">Esquecer tudo</button>
    </div>
    <div id="lastPreview" class="last-preview hidden">
      <img id="lastPreviewImg" alt="Prévia da última captura" role="button" tabindex="0"
        title="Toque para copiar a imagem" />
    </div>
    <textarea id="promptInput" placeholder="O que a IA deve fazer com a imagem?" rows="2"></textarea>
    <div class="action-row">
      <button id="captureBtn">📸 Capturar</button>
      <button id="stopBtn" disabled title="Parar a análise em andamento">⏹ Parar</button>
    </div>
  </main>

  <section class="stack-header">
    <h2>Respostas</h2>
    <button id="clearAll">Apagar tudo</button>
  </section>
  <div id="stack"></div>

  <div id="lightbox" class="lightbox hidden">
    <img id="lightboxImg" alt="captura" />
  </div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="vendor/marked.min.js"></script>
  <script src="vendor/hljs.min.js"></script>
  <script src="vendor/dompurify.min.js"></script>
  <script src="vendor/katex.min.js"></script>
  <script src="vendor/marked-katex.min.js"></script>
  <script src="pageB.js"></script>
</body>
</html>
